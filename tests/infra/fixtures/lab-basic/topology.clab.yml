# Smallest useful lab: one FRR router and one host on a shared link.
# The infra tests replace `name` with a unique bfx-t-* name before deploying.
name: bfx-t-placeholder
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      cap-add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SYS_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf
        - r1/vtysh.conf:/etc/frr/vtysh.conf
    h1:
      kind: linux
      image: breakfix-host:0.1.0
      cap-add: [NET_ADMIN, NET_RAW]
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route add default via 10.0.1.1
  links:
    - endpoints: ["r1:eth1", "h1:eth1"]
