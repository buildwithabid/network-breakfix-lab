# branch LAN ── r1 ── r2 (core) ── r3 ── data centre LAN
name: lab
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
    h1:
      kind: linux
      image: breakfix-host:0.1.0
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route add default via 10.0.1.1
    srv:
      kind: linux
      image: breakfix-host:0.1.0
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.3.10/24 dev eth1
        - ip route add default via 10.0.3.1
  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "srv:eth1"]
