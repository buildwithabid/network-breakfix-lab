# customer LAN ── r1 (AS 65010) ══ eBGP ══ r2 (AS 65020) ── service LAN
name: lab
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
    h1:
      kind: linux
      image: breakfix-host:0.1.0
      exec:
        - ip link set eth1 up
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route add default via 10.0.1.1
    srv:
      kind: linux
      image: breakfix-host:0.1.0
      exec:
        - ip link set eth1 up
        - ip addr add 198.51.100.10/24 dev eth1
        - ip route add default via 198.51.100.1
  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "srv:eth1"]
