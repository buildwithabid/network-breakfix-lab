frr defaults traditional
hostname r2
no ipv6 forwarding
!
ip route 10.0.1.0/24 10.0.12.1
!
interface eth1
 description customer r1 (AS 65010)
 ip address 10.0.12.2/30
exit
!
interface eth2
 description service LAN
 ip address 198.51.100.1/24
exit
!
router bgp 65020
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65010
 neighbor 10.0.12.1 description customer r1
 address-family ipv4 unicast
  network 198.51.100.0/24
 exit-address-family
exit
!
