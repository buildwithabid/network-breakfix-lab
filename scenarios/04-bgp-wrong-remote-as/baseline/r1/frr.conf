frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface eth1
 description customer LAN
 ip address 10.0.1.1/24
exit
!
interface eth2
 description uplink to provider (AS 65020)
 ip address 10.0.12.1/30
exit
!
router bgp 65010
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65020
 neighbor 10.0.12.2 description provider r2
 address-family ipv4 unicast
  network 10.0.1.0/24
 exit-address-family
exit
!
