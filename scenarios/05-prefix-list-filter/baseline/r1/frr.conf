frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface lo
 ip address 192.168.99.1/32
exit
!
interface eth1
 description office LAN
 ip address 10.0.1.1/24
exit
!
interface eth2
 description uplink to HQ (AS 65020)
 ip address 10.0.12.1/30
exit
!
interface eth3
 description sales office LAN
 ip address 10.0.5.1/24
exit
!
ip prefix-list TO-HQ seq 10 permit 10.0.1.0/24
ip prefix-list TO-HQ seq 20 permit 10.0.5.0/24
!
router bgp 65010
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65020
 neighbor 10.0.12.2 description HQ r2
 address-family ipv4 unicast
  redistribute connected
  neighbor 10.0.12.2 prefix-list TO-HQ out
 exit-address-family
exit
!
